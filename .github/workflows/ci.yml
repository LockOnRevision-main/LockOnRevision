name: LOR CI (Beta 2.0)

# Lives in the APP repository root (LockOnRevision/LockOnRevision), which is
# what GitHub hosts and what deploys. A copy in the outer wrapper repo would
# never execute for this code.
on: [push, pull_request]

jobs:
  foundations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx eslint api/_lib/ api/create-pin.js api/revoke-pin.js api/redeem-pin.js api/review-request.js api/set-join-policy.js api/provision-school.js api/revoke-school-admin.js api/search-students.js api/student-profile.js api/manage-membership.js api/school-overview.js api/enroll-academy.js api/create-invitation.js api/resend-invitation.js api/revoke-invitation.js api/accept-invitation.js api/list-invitations.js api/set-permissions.js api/get-permissions.js shared/ tests/ scripts/ src/utils/schoolPermissions.js src/components/SchoolAdminPanel.jsx --max-warnings 20
      - run: npm run build

  emulator-tests:
    # REAL rules proof (Stage 0.2): exercises firestore.rules + storage.rules
    # text against the Firebase emulator. Verified locally with JDK 25
    # (firebase-tools requires 21+); CI provisions temurin 21.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - run: npm i -g firebase-tools
      - run: firebase emulators:exec --only firestore,storage "npm run test:emulator" --project demo-lor
